# Config de Supabase CLI para desarrollo local.
# Requiere Supabase CLI instalado (`npm i -g supabase` o `brew install supabase/tap/supabase`).
# Uso: `supabase start` levanta Postgres/Auth/Storage locales; `supabase db reset` aplica migraciones.

project_id = "jack-cv-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080"]
jwt_expiry = 3600
enable_signup = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_CLIENT_SECRET)"

[storage]
enabled = true
file_size_limit = "10MiB"

[edge_runtime]
enabled = true
